name: Deploy to EC2

on:
  push:
    branches:
      - main
jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Java 25 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Gradle 캐시 설정
        uses: actions/setup-gradle@v3

      - name: 백엔드 빌드 및 테스트
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew build

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH로 EC2 접속 후 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/KTB4_Chloe_Week11
            git pull
            docker-compose down
            docker-compose up -d --build